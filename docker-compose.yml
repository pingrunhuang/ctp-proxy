services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ctp_proxy}
      POSTGRES_USER: ${POSTGRES_USER:-ctp_proxy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctp_proxy_change_me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ${POSTGRES_DATA_DIR:-./data}:/var/lib/postgresql/data
    ports:
      - "5401:5432"

  ctp-proxy:
    build: .
    platform: linux/amd64
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
      - systempaths=unconfined
    env_file: .env
    environment:
      LANG: C
      LC_ALL: C
      # The process must listen on the container interface for published ports
      # to be reachable by an engine running on the Docker host.
      ZMQ_BIND_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-ctp_proxy}:${POSTGRES_PASSWORD:-ctp_proxy_change_me}@postgres:5432/${POSTGRES_DB:-ctp_proxy}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ZMQ_PUB_PORT:-5565}:${ZMQ_PUB_PORT:-5565}"
      - "${ZMQ_REP_PORT:-5566}:${ZMQ_REP_PORT:-5566}"
    volumes:
      - ./flow:/app/flow
      - ./logs:/app/logs
      - type: bind
        source: /sys/firmware/dmi/tables
        target: /sys/firmware/dmi/tables
        read_only: true
        bind:
          create_host_path: false
