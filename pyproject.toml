[project]
name = "ctp-proxy"
version = "0.1.0"
description = "Multi-client CTP gateway exposed over ZeroMQ"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7.3",
    "openctp-ctp>=6.7.11.0; platform_system == 'Windows' or (platform_system == 'Linux' and platform_machine == 'x86_64')",
    "psycopg[binary,pool]>=3.2.0",
    "python-dotenv>=1.2.2",
    "pyzmq>=25.1.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests that require PostgreSQL or external services"]
